<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087e94">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Super Nipotini">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="La nostra sala giochi: piccole avventure da giocare insieme, anche offline.">
  <title>La Nostra Sala Giochi</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/legacy.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/road.css">
  <link rel="stylesheet" href="./css/v8.css">
  <link rel="stylesheet" href="./css/v82.css">
  <link rel="preload" as="image" href="./assets/splash.webp">
  <style>
    #launchSplash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#087e94;pointer-events:none;animation:splashFailOpen 8s step-end forwards}
    #launchSplash[hidden]{display:none!important}
    #launchSplash img{max-width:100vw;max-height:100dvh;object-fit:contain}
    @keyframes splashFailOpen{to{visibility:hidden}}
  </style>
  <script defer src="./js/splash.js"></script>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/pwa.js"></script>
</head>
<body>
  <div id="launchSplash" role="status" aria-live="polite" aria-label="Avvio Super Nipotini">
    <div class="splashPanel">
      <img src="./assets/splash.webp" alt="Super Nipotini: Ricky, Bea e Biscotto sulla spiaggia sotto un’insegna di legno" width="864" height="1152" fetchpriority="high">
      <div class="splashCopy"><span class="splashLoader" aria-hidden="true"></span><p>Prepariamo le avventure…</p></div>
    </div>
  </div>
  <noscript><style>#launchSplash{display:none!important}</style></noscript>
  <main id="home" aria-labelledby="homeTitle">
    <h1 id="homeTitle" class="srOnly">La nostra sala giochi — Super Nipotini</h1>
    <div class="panorama">
      <div class="illustratedScene">
        <div class="heroBanner">
          <img src="./home.png" alt="Ricky, Bea e Biscotto con l’insegna La nostra sala giochi sulla spiaggia tropicale" width="1536" height="1024" fetchpriority="high">
          <button id="bannerSettings" class="bannerAction" aria-label="Impostazioni della sala giochi"></button>
          <button id="bannerRecords" class="bannerAction" aria-label="Apri i record della sala giochi"></button>
        </div>
        <div id="gameGrid" aria-label="Scegli uno dei dodici giochi"></div>
      </div>
    </div>
    <div class="welcome"><span id="offlineState" role="status">Preparazione per giocare offline…</span></div>
    <p id="collectionHome"></p>
    <nav class="homeNav" aria-label="Sala giochi">
      <button class="btn" data-go="records">⭐ Record</button>
      <button class="btn" data-go="favorites">♥ Preferiti</button>
      <button class="btn" data-go="settings">⚙ Impostazioni</button>
      <button class="btn" id="installApp" hidden>＋ Installa</button>
    </nav>
    <p class="installHelp">Su iPhone e iPad: apri in Safari, tocca Condividi e scegli “Aggiungi alla schermata Home”.</p>
    <aside id="updateNotice" hidden role="status">È pronta una nuova versione. <button class="btn" id="updateApp">Aggiorna e torna alla home</button></aside>
    <noscript>Per giocare serve JavaScript attivo nel browser.</noscript>
  </main>
  <div id="rewardToast" role="status" hidden></div>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="title" tabindex="-1" inert>
    <section class="panel">
      <header><button class="btn close" id="back">⌂ Home</button><h2 id="title">Gioco</h2><button class="btn" id="restart">↻ Riprova</button></header>
      <p id="status" role="status" aria-live="off"></p>
      <div id="play"></div>
      <p class="tiny" id="tip"></p>
    </section>
  </div>
</body>
</html>
